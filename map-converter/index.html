<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Naver ↔ Google 地圖座標轉換 · 左右對照</title>
<meta name="description" content="Google Maps 與 Naver Map 左右對照轉換：貼上任一邊連結，自動算出另一邊。座標通用 WGS84，只有 Naver 網址的 c= 是 Web Mercator (EPSG:3857) 公尺座標。">
<style>
/* FIX fix16: 簡化頁面 — 只顯示必要按鈕，隱藏連結文字、複製按鈕、座標副按鈕與範例（JS 仍更新它們，僅不顯示）。 */
#googleLink,#googleApp,#naverLink,#naverApp,#naverAppAndroidText,#googleCoordOpen,#naverCoordOpen,#exampleBtn{display:none!important}
*{box-sizing:border-box}
:root{--google:#1a73e8;--naver:#03c75a;--bg:#f6f7f9;--card:#fff;--line:#e2e6eb;--text:#1a1d21;--muted:#667085}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.5}
header{padding:20px 16px 12px;max-width:1080px;margin:0 auto}
h1{font-size:22px;margin:0 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0}
.sub b{color:var(--text)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--text)}
input:focus,textarea:focus{outline:2px solid #a8c7fa;border-color:#a8c7fa}
textarea{min-height:68px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button,.btn{appearance:none;border:0;border-radius:999px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:#111;color:#fff}
.btn-ghost{background:#eef2f6;color:#111}
.btn-google{background:var(--google);color:#fff}
.btn-naver{background:var(--naver);color:#fff}
.btn-small{padding:7px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;position:relative}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel-head{padding:14px 16px;color:#fff;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.panel-head.google{background:var(--google)}
.panel-head.naver{background:var(--naver)}
.panel-body{padding:6px 16px 16px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;font-size:14px;background:#f6f7f9;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.linkrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.badge{font-size:12px;background:rgba(255,255,255,.22);padding:4px 8px;border-radius:999px}
.vs{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;z-index:2;border:3px solid var(--bg)}
.status{font-size:13px;margin-top:10px;min-height:20px}
.status.ok{color:#067647}.status.err{color:#b42318}
h2{font-size:16px;margin:14px 0 4px}
ol,ul{margin:8px 0;padding-left:20px;font-size:14px}
code{background:#eef2f6;padding:2px 6px;border-radius:6px;font-size:13px}
@media(max-width:760px){
  .grid{grid-template-columns:1fr}
  .vs{display:none}
  h1{font-size:20px}
}
</style>
</head>
<body>
<header>
  <h1>Naver ↔ Google 地圖轉換</h1>
</header>

<div class="wrap">
  <div class="card">
    <textarea id="paste" placeholder="貼上 Google / Naver 連結或座標"></textarea>
    <div class="row">
      <button class="btn-primary" id="parseBtn" type="button">解析並對照 →</button>
      <button class="btn-ghost" id="exampleBtn" type="button">填入範例</button>
      <button class="btn-ghost" id="clearBtn" type="button">清除</button>
      <button class="btn-ghost" id="expandBtn" type="button" style="display:none">在新分頁打開短連結展開 →</button>
    </div>
    <div class="status" id="parseStatus"></div>
    <input id="name" placeholder="店名 / 地址" autocomplete="off" style="margin-top:10px">
  </div>

  <div class="grid">
    <div class="vs">⇄</div>
    <!-- LEFT: Google -->
    <section class="panel" aria-label="Google Maps">
      <div class="panel-head google"><span>Google Maps</span></div>
      <div class="panel-body">
        <input id="lat" inputmode="decimal" placeholder="緯度" style="margin-bottom:8px">
        <input id="lng" inputmode="decimal" placeholder="經度">
        <div class="mono" id="googleLink">—</div>
        <div class="linkrow">
          <a class="btn btn-google btn-small" id="googleOpen" href="#" target="_blank" rel="noopener">在 Google Maps 開啟</a>
          <a class="btn btn-google btn-small" id="googleCoordOpen" href="#" target="_blank" rel="noopener">座標圖釘開啟</a>
          <a class="btn btn-ghost btn-small" id="googleNameFallback" href="#" target="_blank" rel="noopener" style="display:none">備援：店名搜尋</a>
        </div>
        <div class="mono" id="googleApp">—</div>
        <div class="linkrow">
          <a class="btn btn-google btn-small" id="googleAppIOS" href="#" target="_blank" rel="noopener">iPhone App</a>
          <a class="btn btn-google btn-small" id="googleAppAndroid" href="#" target="_blank" rel="noopener">Android App</a>
        </div>
      </div>
    </section>

    <!-- RIGHT: Naver -->
    <section class="panel" aria-label="Naver Map">
      <div class="panel-head naver"><span>Naver Map</span></div>
      <div class="panel-body">
        <input id="mx" inputmode="decimal" placeholder="X" style="margin-bottom:8px">
        <input id="my" inputmode="decimal" placeholder="Y">
        <div class="mono" id="naverLink">—</div>
        <div class="linkrow">
          <a class="btn btn-naver btn-small" id="naverOpen" href="#" target="_blank" rel="noopener">在 Naver 開啟</a>
          <a class="btn btn-naver btn-small" id="naverCoordOpen" href="#" target="_blank" rel="noopener">座標開啟</a>
          <a class="btn btn-naver btn-small" id="naverAppOpen" href="#" target="_blank" rel="noopener">iPhone App</a>
          <a class="btn btn-naver btn-small" id="naverAppAndroid" href="#" target="_blank" rel="noopener">Android App</a>
          <a class="btn btn-ghost btn-small" id="naverNameFallback" href="#" target="_blank" rel="noopener" style="display:none">備援：店名搜尋</a>
        </div>
        <div class="mono" id="naverApp">—</div>
        <div class="mono" id="naverAppAndroidText">—</div>
      </div>
    </section>
  </div>
  <p class="note" style="text-align:center">v2026-10-18-fix20</p>
</div>

<script>
const R = 20037508.34;
const $ = id => document.getElementById(id);
const els = {paste:$('paste'),name:$('name'),lat:$('lat'),lng:$('lng'),mx:$('mx'),my:$('my'),
  googleLink:$('googleLink'),googleApp:$('googleApp'),googleOpen:$('googleOpen'),googleCoordOpen:$('googleCoordOpen'),
  googleAppIOS:$('googleAppIOS'),googleAppAndroid:$('googleAppAndroid'),googleNameFallback:$('googleNameFallback'),
  naverLink:$('naverLink'),naverApp:$('naverApp'),naverOpen:$('naverOpen'),naverCoordOpen:$('naverCoordOpen'),naverAppOpen:$('naverAppOpen'),
  naverAppAndroid:$('naverAppAndroid'),naverAppAndroidText:$('naverAppAndroidText'),naverNameFallback:$('naverNameFallback'),status:$('parseStatus')};
let syncing = false;
let currentPinId = '';
// FIX fix17: Google 的 ID 是 ftid（Google 地點頁 / ?q= 跳轉連結裡的 ftid=0x... 參數），與 Naver pinId 對應。
// 找 ID 失敗時，兩邊主按鈕都不退回店名搜尋，改顯示「ID 未找到」；店名搜尋降為明確標示的備援按鈕。
let currentGoogleId = '';
// FIX fix13: 不以店名/地名為主 — 座標/ID 優先，但必須是「這間店的」座標才優先。
// 座標與店名從同一條連結一起解析出來時，coordsValidForName=true，座標優先；
// 使用者手動改店名時，舊座標不再保證是這間店的，coordsValidForName=false，店名搜尋優先（避免南浦洞舊座標誤開）。
let coordsValidForName = false;

function wgsToMerc(lng,lat){
  const x = lng * R / 180;
  const y = Math.log(Math.tan((90+lat)*Math.PI/360)) / (Math.PI/180) * R / 180;
  return [x,y];
}
function mercToWgs(x,y){
  const lng = x * 180 / R;
  const lat = Math.atan(Math.exp(y*Math.PI/R)) * 360/Math.PI - 90;
  return [lng,lat];
}
function fmt(n,d){ return Number(n).toFixed(d); }
function setStatus(msg,ok){ els.status.textContent = msg||''; els.status.className='status '+(ok?'ok':'err'); }

function updateLinks(){
  const lat = parseFloat(els.lat.value), lng = parseFloat(els.lng.value);
  const name = els.name.value.trim();
  const hasCoords = isFinite(lat) && isFinite(lng);
  const hasName = !!name;
  const APPNAME = encodeURIComponent('https://trevor-web-cloud.github.io/korea-drug-check/map-converter/');
  // FIX fix9: 主按鈕優先走店名/地址搜尋，否則任何地址都會被預設南浦洞座標帶走。
  // 原因：座標欄預設是南浦站，之前主按鈕一律用座標連結，填了店名也還是開南浦洞。
  // 新規則：有店名 → 主按鈕 = 店名搜尋；座標圖釘是另一個按鈕，僅在座標確定是這間店時才點。
  // App 分享都是短網址：短連結本身無座標，貼短連結時不得沿用舊座標，必須先展開或用店名搜尋。
  if(!hasCoords && !hasName){
    els.googleLink.textContent='—'; els.googleApp.textContent='—'; els.naverLink.textContent='—'; els.naverApp.textContent='—';
    if(els.naverAppAndroidText) els.naverAppAndroidText.textContent='—';
    // FIX fix20: 清空時必須同時重置所有按鈕文字 + 隱藏備援按鈕，否則上一個狀態的「地點 ID / ID 未找到 / 備援」文字會殘留。
    els.googleOpen.href='#'; els.googleOpen.textContent='在 Google Maps 開啟';
    els.naverOpen.href='#'; els.naverOpen.textContent='在 Naver 開啟';
    if(els.googleCoordOpen){ els.googleCoordOpen.href='#'; els.googleCoordOpen.style.display='none'; }
    if(els.naverCoordOpen){ els.naverCoordOpen.href='#'; els.naverCoordOpen.style.display='none'; }
    if(els.googleAppIOS){ els.googleAppIOS.href='#'; els.googleAppIOS.textContent='iPhone App'; }
    if(els.googleAppAndroid){ els.googleAppAndroid.href='#'; els.googleAppAndroid.textContent='Android App'; }
    if(els.naverAppOpen){ els.naverAppOpen.href='#'; els.naverAppOpen.textContent='iPhone App'; }
    if(els.naverAppAndroid){ els.naverAppAndroid.href='#'; els.naverAppAndroid.textContent='Android App'; }
    if(els.googleNameFallback) els.googleNameFallback.style.display='none';
    if(els.naverNameFallback) els.naverNameFallback.style.display='none';
    return;
  }
  const latS = hasCoords ? fmt(lat,6) : '', lngS = hasCoords ? fmt(lng,6) : '';
  // FIX fix17: Google 與 Naver 主按鈕都只用 ID 搜尋，不退回店名搜尋。
  // Google ID 優先順序：ftid（連結裡的 Google 地點 ID）> 座標圖釘（座標是這間店的）> ID 未找到。
  // 店名搜尋僅為備援按鈕（googleNameFallback），ID 缺失時才顯示。
  const coordsPrimary = hasCoords && (coordsValidForName || !hasName);
  const gCoordWeb = hasCoords ? 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(latS+','+lngS) : '';
  const gNameWeb = hasName ? 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name) : '';
  const gFtidWeb = currentGoogleId ? 'https://maps.google.com/?ftid='+encodeURIComponent(currentGoogleId) : '';
  els.googleLink.textContent = (currentGoogleId ? 'ID (ftid)：'+gFtidWeb : '') + (coordsPrimary ? '\n座標圖釘：'+gCoordWeb : '');
  if(currentGoogleId){
    els.googleOpen.href = gFtidWeb;
    els.googleOpen.textContent = '在 Google Maps 開啟 (地點 ID)';
  }else if(coordsPrimary){
    els.googleOpen.href = gCoordWeb;
    els.googleOpen.textContent = '在 Google Maps 開啟 (座標圖釘)';
  }else{
    els.googleOpen.href = '#';
    els.googleOpen.textContent = 'ID 未找到';
  }
  if(els.googleCoordOpen){ els.googleCoordOpen.href = gCoordWeb || '#'; els.googleCoordOpen.style.display = hasCoords ? '' : 'none'; }
  const gAppCoord = hasCoords ? 'comgooglemaps://?q='+encodeURIComponent(latS+','+lngS)+'&zoom=17' : '';
  const gAppName = hasName ? 'comgooglemaps://?q='+encodeURIComponent(name)+'&zoom=17' : '';
  const gAppAndroidCoord = hasCoords ? 'geo:'+latS+','+lngS+'?q='+encodeURIComponent(latS+','+lngS) : '';
  const gAppAndroidName = hasName ? 'geo:0,0?q='+encodeURIComponent(name) : '';
  els.googleApp.textContent = (coordsPrimary ? '座標圖釘 iPhone：'+gAppCoord+'\n座標圖釘 Android：'+gAppAndroidCoord : '') + (hasName ? (coordsPrimary ? '\n' : '') + '店名搜尋 iPhone：'+gAppName+'\n店名搜尋 Android：'+gAppAndroidName : '') + (!coordsPrimary && hasCoords ? '\n座標圖釘 iPhone：'+gAppCoord+'\n座標圖釘 Android：'+gAppAndroidCoord : '');
  // FIX fix17: Google App 按鈕也只用 ID — ftid 無法直接用於 App URL Scheme，App 用座標圖釘；無座標時顯示 ID 未找到，不退回店名搜尋。
  if(els.googleAppIOS) els.googleAppIOS.href = coordsPrimary ? (gAppCoord || '#') : '#';
  if(els.googleAppIOS) els.googleAppIOS.textContent = coordsPrimary ? 'iPhone App' : 'iPhone App（ID 未找到）';
  if(els.googleAppAndroid) els.googleAppAndroid.href = coordsPrimary ? (gAppAndroidCoord || '#') : '#';
  if(els.googleAppAndroid) els.googleAppAndroid.textContent = coordsPrimary ? 'Android App' : 'Android App（ID 未找到）';
  if(els.googleNameFallback){
    if(hasName && !currentGoogleId && !coordsPrimary){
      els.googleNameFallback.href = gNameWeb;
      els.googleNameFallback.style.display = '';
    }else els.googleNameFallback.style.display = 'none';
  }

  const [x,y] = hasCoords ? wgsToMerc(lng,lat) : [NaN,NaN];
  const xS = hasCoords ? fmt(x,2) : '', yS = hasCoords ? fmt(y,2) : '';
  // FIX 2026-10-18: Naver /p/search/「緯度,經度」會 No results found，勿再產生。
  const nCoordWeb = hasCoords ? 'https://map.naver.com/p?c='+xS+','+yS+',15,0,0,0,dh' : '';
  const nSearch = hasName ? 'https://map.naver.com/p/search/'+encodeURIComponent(name) : '';
  // Naver App：有店名 → nmap://search / intent://search；無店名有座標 → nmap://place / intent://place
  const nAppCoord = hasCoords ? 'nmap://place?lat='+latS+'&lng='+lngS+'&name='+encodeURIComponent(name||latS+','+lngS)+'&appname='+APPNAME : '';
  const nAppName = hasName ? 'nmap://search?query='+encodeURIComponent(name)+'&appname='+APPNAME : '';
  const nAppAndroidCoord = hasCoords ? 'intent://place?lat='+latS+'&lng='+lngS+'&name='+encodeURIComponent(name||latS+','+lngS)+'&appname='+APPNAME+'#Intent;scheme=nmap;package=com.nhn.android.nmap;S.browser_fallback_url='+encodeURIComponent('https://play.google.com/store/apps/details?id=com.nhn.android.nmap')+';end' : '';
  const nAppAndroidName = hasName ? 'intent://search?query='+encodeURIComponent(name)+'&appname='+APPNAME+'#Intent;scheme=nmap;package=com.nhn.android.nmap;S.browser_fallback_url='+encodeURIComponent('https://play.google.com/store/apps/details?id=com.nhn.android.nmap')+';end' : '';
  els.naverLink.textContent = (hasName ? '店名/地址搜尋：'+nSearch : '') + (hasCoords ? (hasName ? '\n' : '') + '座標 (c=)：'+nCoordWeb : '') + (currentPinId ? '\n地點連結（place ID，不受語言影響）：https://map.naver.com/p/entry/place/'+currentPinId : '') + (!hasName ? '\n（無店名/地址時，Naver 不提供座標搜尋連結，請用上面 c= 或 App 圖釘連結）' : '');
  els.naverApp.textContent = (hasName ? '店名搜尋：'+nAppName : '') + (hasCoords ? (hasName ? '\n' : '') + '座標圖釘：'+nAppCoord : '');
  if(els.naverAppAndroidText) els.naverAppAndroidText.textContent = (hasName ? '店名搜尋：'+nAppAndroidName : '') + (hasCoords ? (hasName ? '\n' : '') + '座標圖釘：'+nAppAndroidCoord : '');
  // FIX fix17: Naver 主按鈕也只用 ID 搜尋 — pinId → place；無 pinId 時，座標是這間店的 → c= / 座標圖釘；
  // 兩者都沒有時，顯示「ID 未找到」，不退回店名搜尋。店名搜尋僅為備援按鈕（naverNameFallback）。
  const nPlace = currentPinId ? 'https://map.naver.com/p/entry/place/'+currentPinId : '';
  if(nPlace){
    els.naverOpen.href = nPlace;
    els.naverOpen.textContent = '在 Naver 開啟 (地點 ID)';
  }else if(coordsPrimary){
    els.naverOpen.href = nCoordWeb || '#';
    els.naverOpen.textContent = '在 Naver 開啟 (座標)';
  }else{
    els.naverOpen.href = '#';
    els.naverOpen.textContent = 'ID 未找到';
  }
  if(els.naverCoordOpen){ els.naverCoordOpen.href = nCoordWeb || '#'; els.naverCoordOpen.style.display = hasCoords ? '' : 'none'; }
  const naverAppMain = nPlace || (coordsPrimary ? nAppCoord : '#');
  const naverAppMainLabel = nPlace ? 'iPhone App（地點 ID）' : (coordsPrimary ? 'iPhone App（座標圖釘）' : 'iPhone App（ID 未找到）');
  const naverAppAndroidMain = nPlace || (coordsPrimary ? nAppAndroidCoord : '#');
  const naverAppAndroidLabel = nPlace ? 'Android App（地點 ID）' : (coordsPrimary ? 'Android App（座標圖釘）' : 'Android App（ID 未找到）');
  if(els.naverAppOpen){ els.naverAppOpen.href = naverAppMain; els.naverAppOpen.textContent = naverAppMainLabel; }
  if(els.naverAppAndroid){ els.naverAppAndroid.href = naverAppAndroidMain; els.naverAppAndroid.textContent = naverAppAndroidLabel; }
  if(els.naverNameFallback){
    if(hasName && !nPlace && !coordsPrimary){
      els.naverNameFallback.href = nSearch;
      els.naverNameFallback.style.display = '';
    }else els.naverNameFallback.style.display = 'none';
  }
}

function updateFromLatLng(lat,lng,msg){
  if(syncing) return; syncing=true;
  els.lat.value = fmt(lat,6); els.lng.value = fmt(lng,6);
  const [x,y]=wgsToMerc(lng,lat);
  els.mx.value = fmt(x,2); els.my.value = fmt(y,2);
  // FIX fix13: 座標被明確設定（解析連結或手動輸入），視為是目前這間店的，座標優先。
  coordsValidForName = true;
  syncing=false; updateLinks(); if(msg) setStatus(msg,true);
}
function updateFromXY(x,y,msg){
  if(syncing) return; syncing=true;
  els.mx.value = fmt(x,2); els.my.value = fmt(y,2);
  const [lng,lat]=mercToWgs(x,y);
  els.lat.value = fmt(lat,6); els.lng.value = fmt(lng,6);
  coordsValidForName = true;
  syncing=false; updateLinks(); if(msg) setStatus(msg,true);
}

// FIX fix5: Google /place/ 地點頁展開後也沒有 @lat,lng / !3d / !4d，只有
// 店名（/place/<店名>/）+ Plus Code（data 裡的 20s8Q7C5RJG+F63）。
// 必須解析這兩項，否則使用者照指示展開再貼回來還是「解析失敗」。
function plusCodeDecode(code){
  // code: e.g. 8Q7C5RJG+F63 -> lat/lng center
  const ALPH = '23456789CFGHJMPQRVWX';
  const clean = code.toUpperCase().replace(/\+/g,'').replace(/0/g,'');
  const pair = clean.slice(0,10), grid = clean.slice(10);
  let lat = -90, lng = -180, res = 20;
  for(let i=0;i<pair.length;i+=2){
    lat += ALPH.indexOf(pair[i]) * res;
    lng += ALPH.indexOf(pair[i+1]) * res;
    res /= 20;
  }
  const n = grid.length;
  if(!n) return [lat+0.000125/2, lng+0.000125/2];
  let latRes = 0.000125/5, lngRes = 0.000125/4;
  for(const ch of grid){
    const v = ALPH.indexOf(ch);
    lat += Math.floor(v/4) * latRes;
    lng += (v%4) * lngRes;
    latRes /= 5; lngRes /= 4;
  }
  const latCell = 0.000125 / Math.pow(5,n), lngCell = 0.000125 / Math.pow(4,n);
  return [lat+latCell/2, lng+lngCell/2];
}

// FIX fix15: 短連結主動切換為 ID — Worker 已部署在 map-resolve.tsai0215.workers.dev，做 HEAD + redirect:manual 取得 Location。
// 若 Worker 程式碼尚未換成 worker.js（仍是 Hello World），會退回手動展開流程；換好程式碼後自動解析生效。
const RESOLVE_WORKER = 'https://map-resolve.tsai0215.workers.dev/resolve';
async function resolveShortLink(shortUrl){
  try{
    const r = await fetch(RESOLVE_WORKER+'?url='+encodeURIComponent(shortUrl), {signal: AbortSignal.timeout(8000)});
    if(!r.ok) return null;
    const j = await r.json();
    return (j && j.location) ? j.location : null;
  }catch(e){ return null; }
}
function parseInput(){
  const raw = els.paste.value.trim();
  if(!raw){ setStatus('請先貼上連結或座標。',false); return; }
  // FIX fix17: 解析新輸入時先清空舊 ID，避免殘留上一個地點的 ftid / pinId 被誤用。
  currentPinId = ''; currentGoogleId = '';
  const expandBtn = $('expandBtn');
  // FIX fix6: 貼上整段分享文字（[NAVER Maps]\n店名\n地址\n短連結）時，必須先取出乾淨的 URL，
  // 否則 window.open(整段文字) 會被當成相對路徑，在 GitHub Pages 上開出 404。
  const urlInText = raw.match(/https?:\/\/[^\s]+/);
  const cleanUrl = urlInText ? urlInText[0].replace(/[）\]】.,;]+$/,'') : raw;
  // FIX 2026-10-18: 短連結本身沒有座標，純前端無法直接解（CORS + 需跟隨跳轉）。
  // 先明確告知 + 提供一鍵在新分頁展開，展開後再複製網址列的完整連結回來貼。
  // 注意：展開按鈕必須開 cleanUrl，不是 raw，否則貼整段分享文字會 404。
  if(/maps\.app\.goo\.gl|goo\.gl\/maps|naver\.me\//i.test(cleanUrl) && !/[@?].*(\d+\.\d+|!3d|c=)/.test(cleanUrl)){
    // 分享整段文字時，順便取出店名（第 2 行），讓下方搜尋連結先可用
    // FIX fix7: 只有「這次」真的取出店名才說已取出；否則殘留的上一次店名會被誤說成這次取出的。
    // FIX fix9: App 分享都是短網址，短連結本身無座標，必須清空舊座標，
    // 否則座標欄殘留南浦洞預設值，點「座標圖釘」會誤開南浦洞。
    const lines = raw.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    let nameLine = lines.find(s=>!/^\[NAVER|^\[Google|https?:\/\//i.test(s) && !/釜山|부산|市|区|洞|동|路|로|街|道/.test(s));
    // FIX fix10: 分享文字可能被貼成「一行」（換行遺失），上面按行找會找不到店名。
    // 備援：從整段文字去掉 [NAVER Maps]、網址、地址部分，剩下的就是店名。
    if(!nameLine){
      let one = raw.replace(/\[NAVER Maps\]|\[Google Maps\]/gi,' ').replace(/https?:\/\/[^\s]+/g,' ').replace(/\s+/g,' ').trim();
      // 地址通常從 釜山/부산/市/区/洞/동/路/로/街/道 開始，切掉地址及之後的部分
      const addrIdx = one.search(/釜山|부산|市|区|洞|동|路|로|街|道/);
      if(addrIdx > 0) one = one.slice(0, addrIdx).trim();
      if(one && one.length >= 2 && one.length <= 60) nameLine = one;
    }
    let newlyExtracted = false;
    if(nameLine){ els.name.value = nameLine; newlyExtracted = true; }
    els.lat.value=''; els.lng.value=''; els.mx.value=''; els.my.value='';
    coordsValidForName=false;
    // FIX fix10: 必須無條件呼叫 updateLinks()，否則店名為空時按鈕會殘留南浦洞預設值。
    updateLinks();
    // FIX fix14: 短連結主動切換為 ID — 先試 Worker 自動解析（取 Location 裡的 pinId + 座標），
    // 成功就直接用展開後的完整連結重新解析，ID/座標自動填上；Worker 未部署或失敗時，退回手動展開流程。
    setStatus('正在主動解析短連結取 ID…（透過解析服務取得跳轉目標）',false);
    if(expandBtn){ expandBtn.style.display=''; expandBtn.onclick=()=>{ window.open(cleanUrl,'_blank','noopener'); }; }
    resolveShortLink(cleanUrl).then(loc=>{
      if(loc){
        els.paste.value = loc;
        parseInput();
      }else{
        setStatus('自動解析失敗，請按「展開」手動取完整連結再貼回來。'+(newlyExtracted ? '已取出店名「'+els.name.value+'」。' : ''),false);
      }
    });
    return;
  }
  if(expandBtn) expandBtn.style.display='none';
  // FIX fix11: 非韓文連結自動轉韓文版 — 純前端做不到「自動取得韓文原名」（韓文名只在 Naver 地點頁，CORS 擋；機器翻譯地名不可靠）。
  // 可做到的是：從跳轉連結取出 pinId（與語言無關的地點 ID），產生 place 連結，直接開正確地點，完全不用搜尋，就不會踩到翻譯名搜不到的坑。
  // 若 title 不含韓文，明確提示這是翻譯名，韓文原名需開 place 連結確認。
  const pinMatch = raw.match(/[?&]pinId\s*=\s*(\d+)/i) || raw.match(/\/p\/entry\/place\/(\d+)/i);
  if(pinMatch) currentPinId = pinMatch[1];
  // FIX fix17: 取出 Google ftid（Google 的地點 ID），否則 ?q= 連結會被誤判為「沒有 ID」而退回店名搜尋。
  const ftidMatch = raw.match(/[?&]ftid\s*=\s*([^&]+)/i);
  if(ftidMatch){ try{ currentGoogleId = decodeURIComponent(ftidMatch[1]); }catch(e){ currentGoogleId = ftidMatch[1]; } }
  // FIX fix6: Naver 短連結展開後的跳轉網址本身就帶座標 + 店名：
  // map.naver.com/?title=兄弟潜水艇&pinId=...&lng=129.0972166&lat=35.1235958
  // 之前解析器不認 ?lat= / ?lng= 分開的參數，會誤判解析失敗。
  const latParam = raw.match(/[?&]lat\s*=\s*(-?\d+(?:\.\d+)?)/i);
  const lngParam = raw.match(/[?&]lng\s*=\s*(-?\d+(?:\.\d+)?)/i);
  if(latParam && lngParam){
    const la = parseFloat(latParam[1]), ln = parseFloat(lngParam[1]);
    if(Math.abs(la)<=90 && Math.abs(ln)<=180){
      const tm = raw.match(/[?&]title\s*=\s*([^&]+)/i);
      if(tm){ try{ els.name.value = decodeURIComponent(tm[1]); }catch(e){} }
      const isKorean = /[\uAC00-\uD7A3]/.test(els.name.value);
      const pinNote = currentPinId ? '（ID '+currentPinId+'）' : '';
      const langNote = (!isKorean && els.name.value) ? '（非韓文名，已轉 ID）' : '';
      updateFromLatLng(la, ln, '已解析：'+(els.name.value||'')+pinNote+langNote);
      return;
    }
  }
  // Naver c= : c=14364073,4177191  (allow spaces)
  let m = raw.match(/c\s*=\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/i);
  if(m){
    const x=parseFloat(m[1]), y=parseFloat(m[2]);
    if(Math.abs(x)<=20037508.34 && Math.abs(y)<=20037508.34){
      updateFromXY(x,y,'已解析 Naver c= → 換算為 Google 經緯度。');
      return;
    }
  }
  // Google place data: !3d lat !4d lng  (expanded share links often use this, not @lat,lng)
  // Also handle reversed order just in case.
  let m3 = raw.match(/!3d(-?\d+(?:\.\d+)?)/), m4 = raw.match(/!4d(-?\d+(?:\.\d+)?)/);
  if(m3 && m4){
    const lat = parseFloat(m3[1]), lng = parseFloat(m4[1]);
    if(Math.abs(lat)<=90 && Math.abs(lng)<=180){ updateFromLatLng(lat,lng,'已解析 Google !3d緯度 !4d經度。'); return; }
  }
  // Google @lat,lng  or  ?q=lat,lng / ?query=lat,lng / api=1&query=lat,lng / ?ll= / ?center= / ?destination=
  m = raw.match(/@(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
  if(m){ updateFromLatLng(parseFloat(m[1]),parseFloat(m[2]),'已解析 Google @緯度,經度。'); return; }
  m = raw.match(/[?&](?:q|query|ll|center|destination|saddr|daddr)\s*=\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/i);
  if(m){ updateFromLatLng(parseFloat(m[1]),parseFloat(m[2]),'已解析 Google ?q=緯度,經度。'); return; }
  // FIX fix8: Google goo.gl 展開後的 maps.google.com?q=<店名+地址>（非座標）：
  // 例 ?q=南韓 Gyeongsangnam-do, Miryang-si, ... 三浪津生態文化公園&ftid=...
  // FIX fix17: 同時取出 ftid（Google ID），Google 主按鈕用 ID 搜尋，不退回店名搜尋。
  const qText = raw.match(/[?&](?:q|query)\s*=\s*([^&]+)/i);
  if(qText){
    let qDec = '';
    try{ qDec = decodeURIComponent(qText[1].replace(/\+/g,' ')); }catch(e){ qDec = qText[1]; }
    if(qDec && qDec.length>1 && !/^[\d.,\s-]+$/.test(qDec)){
      els.name.value = qDec;
      // FIX fix19: 此連結沒有座標，欄位裡的舊座標（南浦預設值）是殘留的，必須清空 + 標為失效，
      // 否則 Naver 主按鈕會誤用殘留南浦座標當「座標」開啟，且 X/Y 欄會誤顯示南浦值。ID 未找到時主按鈕應為「ID 未找到」，備援按鈕才顯示店名搜尋。
      coordsValidForName = false;
      els.lat.value=''; els.lng.value=''; els.mx.value=''; els.my.value='';
      if(currentGoogleId) setStatus('已解析：'+qDec+'（Google ID 已取出）',true);
      else setStatus('已取出店名「'+qDec+'」：Google ID 未找到，請用備援店名搜尋。',true);
      updateLinks(); return;
    }
  }
  // Bare "lat,lng" — assume Google order lat,lng
  m = raw.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
  if(m){
    const a=parseFloat(m[1]), b=parseFloat(m[2]);
    // If first looks like Mercator meters (>180), treat as X,Y
    if(Math.abs(a)>180 || Math.abs(b)>180){ updateFromXY(a,b,'已解析 X,Y（公尺）→ 換算為經緯度。'); return; }
    updateFromLatLng(a,b,'已解析 緯度,經度。'); return;
  }
  // Naver / Google place search with a name: use it as name
  // e.g. map.naver.com/p/search/xxx  or google .../search/xxx
  // Skip if it looks like "lat,lng" (already handled above, and Naver search with coords returns No results)
  m = raw.match(/\/p\/search\/([^\/?#]+)/);
  if(m){
    const decoded = decodeURIComponent(m[1].replace(/\+/g,' '));
    if(!/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(decoded)){
      els.name.value = decoded; coordsValidForName = false; els.lat.value=''; els.lng.value=''; els.mx.value=''; els.my.value=''; setStatus('已取出搜尋名稱，請再確認。',true); updateLinks(); return;
    }
  }
  // Google /place/<店名>/ 展開連結：取出店名 + Plus Code 解碼
  // 例：google.com/maps/place/釜山金海樂天飯店/data=...!20s8Q7C5RJG+F63...
  // 注意：這種連結沒有 @lat,lng / !3d / !4d，之前會誤判為解析失敗。
  const decodedRaw = (()=>{ try{ return decodeURIComponent(raw); }catch(e){ return raw; } })();
  let placeName = null;
  const pm = decodedRaw.match(/\/place\/([^\/\?#]+)/);
  if(pm){
    try{
      const dn = decodeURIComponent(pm[1].replace(/\+/g,' '));
      if(dn && !/^[\d.,\s-]+$/.test(dn) && !/^data=/i.test(dn)) placeName = dn;
    }catch(e){}
  }
  // Plus Code: 8Q7C5RJG+F63（完整碼）— 在 data 裡是 20s8Q7C5RJG+F63
  const pcm = decodedRaw.match(/([23456789CFGHJMPQRVWX]{2,8}[23456789CFGHJMPQRVWX]{2}\+[23456789CFGHJMPQRVWX]{2,3})/);
  if(pcm){
    const [clat, clng] = plusCodeDecode(pcm[1]);
    if(placeName) els.name.value = placeName;
    updateFromLatLng(clat, clng, '已解析 Google 地點頁：取出店名「'+(placeName||'')+'」+ Plus Code '+pcm[1]+' 解碼為座標（約 3m 格子中心，請以店名搜尋再確認）。');
    return;
  }
  if(placeName){
    els.name.value = placeName;
    coordsValidForName = false;
    els.lat.value=''; els.lng.value=''; els.mx.value=''; els.my.value='';
    setStatus('已取出店名「'+placeName+'」：此連結沒有座標 / Plus Code。',true);
    updateLinks(); return;
  }
  setStatus('解析不到座標：短連結（maps.app.goo.gl / naver.me）需先在瀏覽器打開展開，複製跳轉後的完整連結再貼。完整連結通常含 @緯度,經度 或 !3d緯度!4d經度 或 c= X,Y，或 /place/店名 + Plus Code。',false);
}

els.lat.addEventListener('input',()=>{ const la=parseFloat(els.lat.value), ln=parseFloat(els.lng.value); if(isFinite(la)&&isFinite(ln)&&Math.abs(la)<=90&&Math.abs(ln)<=180) updateFromLatLng(la,ln); });
els.lng.addEventListener('input',()=>{ const la=parseFloat(els.lat.value), ln=parseFloat(els.lng.value); if(isFinite(la)&&isFinite(ln)&&Math.abs(la)<=90&&Math.abs(ln)<=180) updateFromLatLng(la,ln); });
els.mx.addEventListener('input',()=>{ const x=parseFloat(els.mx.value), y=parseFloat(els.my.value); if(isFinite(x)&&isFinite(y)&&Math.abs(x)<=R&&Math.abs(y)<=R) updateFromXY(x,y); });
els.my.addEventListener('input',()=>{ const x=parseFloat(els.mx.value), y=parseFloat(els.my.value); if(isFinite(x)&&isFinite(y)&&Math.abs(x)<=R&&Math.abs(y)<=R) updateFromXY(x,y); });
els.name.addEventListener('input',()=>{ coordsValidForName=false; updateLinks(); });
$('parseBtn').addEventListener('click',parseInput);
$('exampleBtn').addEventListener('click',()=>{ els.name.value='남포역'; updateFromLatLng(35.097883,129.034663,'已填入範例：南浦站 남포역 35.097883,129.034663'); });
$('clearBtn').addEventListener('click',()=>{ els.paste.value=''; els.name.value=''; els.lat.value=''; els.lng.value=''; els.mx.value=''; els.my.value=''; currentPinId=''; currentGoogleId=''; coordsValidForName=false; updateLinks(); setStatus('',true); });
document.querySelectorAll('[data-copy]').forEach(btn=>{
  btn.addEventListener('click', async ()=>{
    const key = btn.getAttribute('data-copy');
    // naverAppAndroid 複製來源是 mono 文字欄，不是 <a> 按鈕本身
    const srcEl = (key==='naverAppAndroid') ? els.naverAppAndroidText : els[key];
    const text = srcEl.textContent.split('\n')[0];
    if(!text || text==='—') return;
    try{ await navigator.clipboard.writeText(text); btn.textContent='已複製 ✓'; setTimeout(()=>{ btn.textContent = key.includes('App')?'複製 App 連結':'複製連結'; },1200); }
    catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); btn.textContent='已複製 ✓'; setTimeout(()=>{ btn.textContent = key.includes('App')?'複製 App 連結':'複製連結'; },1200); }
  });
});
// Prefill example so left/right comparison is visible immediately
updateFromLatLng(35.097883,129.034663);
</script>
